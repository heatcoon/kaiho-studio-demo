<!-- width / height を必ず入れてください。viewBox だけだと <img> で読んだときに
     内在サイズが 0 になり、height:auto の指定で高さが潰れます。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <!-- 中立のプレースホルダロゴ。実案件では差し替えること。
       注意: XML のコメント内にハイフン 2 つを連続して書くと、
       ファイル全体が不正になり画像が表示されなくなります。 -->
  <rect x="2" y="2" width="316" height="96" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <circle cx="52" cy="50" r="26" fill="#1f4e79"/>
  <path d="M40 50 h24 M52 38 v24" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="94" y="44" font-family="sans-serif" font-size="26" font-weight="700" fill="#143654">LOGO</text>
  <text x="94" y="72" font-family="sans-serif" font-size="13" fill="#5a5a5a">placeholder</text>
</svg>
